name: Pipeline Tests

on:
  push:
  pull_request:

jobs:
  fly-pipeline-command-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run pipeline command tests
        run: go test ./fly/commands/... -count=1
